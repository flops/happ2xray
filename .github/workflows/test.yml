name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check dependencies
        run: |
          bash --version
          jq --version
          curl --version
          base64 --version

      - name: Run test suite
        run: bash tests/run.sh
